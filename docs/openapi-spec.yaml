openapi: 3.1.0
info:
  title: Ollama Automation Harness - Internal API Specification
  description: |
    This OpenAPI specification documents the internal Python API interfaces
    of the Ollama Automation Harness. While this is a CLI application (not
    a web service), this specification provides formal documentation of the
    module interfaces for developers and integrations.

    ## Overview

    The harness orchestrates AI-powered development workflows by:
    1. Accepting user prompts
    2. Getting AI responses (Claude API or Ollama fallback)
    3. Classifying actions for safety
    4. Executing approved commands in a sandbox

    ## External Dependencies

    - **Anthropic Claude API**: Primary AI model
    - **Ollama CLI**: Local LLM fallback

  version: 1.0.0
  contact:
    name: Ollama Harness Team
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.anthropic.com/v1
    description: Anthropic Claude API (Primary)
  - url: http://localhost:11434/api
    description: Ollama Local API (Fallback)

tags:
  - name: Claude API
    description: Anthropic Claude API endpoints
  - name: Ollama API
    description: Ollama local inference endpoints
  - name: Internal Modules
    description: Internal Python module interfaces (documented as pseudo-endpoints)

paths:
  # Anthropic Claude API
  /messages:
    post:
      tags:
        - Claude API
      summary: Create a message
      description: |
        Send a prompt to Claude and receive a response.
        This is the primary endpoint used by the harness for AI-powered
        code generation and assistance.
      operationId: createMessage
      security:
        - anthropicApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaudeMessageRequest'
            examples:
              codeGeneration:
                summary: Code generation request
                value:
                  model: claude-sonnet-4-20250514
                  max_tokens: 4096
                  messages:
                    - role: user
                      content: "Write a Python function to calculate factorial"
              withSystem:
                summary: Request with system prompt
                value:
                  model: claude-sonnet-4-20250514
                  max_tokens: 4096
                  system: "You are a Python code assistant. Follow PEP 8 guidelines."
                  messages:
                    - role: user
                      content: "Create a cache class with TTL support"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaudeMessageResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaudeError'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaudeError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaudeError'

  # Ollama API
  /generate:
    post:
      tags:
        - Ollama API
      summary: Generate completion
      description: |
        Generate a completion using a local Ollama model.
        Used as fallback when Claude API is unavailable.
      operationId: ollamaGenerate
      servers:
        - url: http://localhost:11434/api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OllamaGenerateRequest'
            example:
              model: llama3
              prompt: "Write a Python function to check if a string is a palindrome."
              stream: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OllamaGenerateResponse'

  /chat:
    post:
      tags:
        - Ollama API
      summary: Chat completion
      description: Chat-style completion with message history
      operationId: ollamaChat
      servers:
        - url: http://localhost:11434/api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OllamaChatRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OllamaChatResponse'

  /tags:
    get:
      tags:
        - Ollama API
      summary: List models
      description: List all locally available Ollama models
      operationId: ollamaListModels
      servers:
        - url: http://localhost:11434/api
      responses:
        '200':
          description: List of models
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OllamaModelsResponse'

  # Internal Module Interfaces (Pseudo-endpoints for documentation)
  /internal/claude/get_response:
    post:
      tags:
        - Internal Modules
      summary: core.claude.get_response()
      description: |
        **Python Module:** `core.claude`

        Get a response from Claude (API or fallback).

        ```python
        def get_response(prompt: str, use_api: bool | None = None) -> str
        ```
      operationId: claudeGetResponse
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - prompt
              properties:
                prompt:
                  type: string
                  description: The prompt to send to the AI model
                use_api:
                  type: boolean
                  nullable: true
                  description: Force API (true), fallback (false), or auto-detect (null)
      responses:
        '200':
          description: Response text
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string

  /internal/classifier/classify:
    post:
      tags:
        - Internal Modules
      summary: core.classifier.classify()
      description: |
        **Python Module:** `core.classifier`

        Classify a Claude response into an action decision.

        ```python
        def classify(response: str) -> Decision
        ```
      operationId: classifierClassify
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - response
              properties:
                response:
                  type: string
                  description: Raw response from Claude/AI
      responses:
        '200':
          description: Decision object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'

  /internal/executor/execute:
    post:
      tags:
        - Internal Modules
      summary: core.executor.execute()
      description: |
        **Python Module:** `core.executor`

        Execute a command in the sandbox environment.

        ```python
        def execute(command: str, sandbox_root: str = SANDBOX_DIR) -> ExecutionResult
        ```
      operationId: executorExecute
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - command
              properties:
                command:
                  type: string
                  description: Shell command to execute
                sandbox_root:
                  type: string
                  default: "./sandbox"
                  description: Root directory for sandboxed execution
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'

  /internal/safety/check_permission:
    post:
      tags:
        - Internal Modules
      summary: core.safety.check_permission()
      description: |
        **Python Module:** `core.safety`

        Check permission level for an action type.

        ```python
        def check_permission(action_type: str) -> str
        ```
      operationId: safetyCheckPermission
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - action_type
              properties:
                action_type:
                  type: string
                  enum:
                    - read_file
                    - write_file
                    - delete_file
                    - run_tests
                    - git_push
                    - git_commit
                    - deploy
                  description: Type of action to check
      responses:
        '200':
          description: Permission level
          content:
            application/json:
              schema:
                type: object
                properties:
                  permission:
                    type: string
                    enum:
                      - auto
                      - ask
                      - deny

components:
  securitySchemes:
    anthropicApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Anthropic API key (sk-ant-...)

  schemas:
    # Claude API Schemas
    ClaudeMessageRequest:
      type: object
      required:
        - model
        - messages
        - max_tokens
      properties:
        model:
          type: string
          description: Model ID to use
          example: claude-sonnet-4-20250514
        max_tokens:
          type: integer
          minimum: 1
          maximum: 4096
          description: Maximum tokens in response
          example: 4096
        system:
          type: string
          description: System prompt (optional)
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ClaudeMessage'
          minItems: 1
        stream:
          type: boolean
          default: false
          description: Enable streaming response

    ClaudeMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - user
            - assistant
        content:
          type: string

    ClaudeMessageResponse:
      type: object
      properties:
        id:
          type: string
          example: msg_01XFDUDYJgAACzvnptvVoYEL
        type:
          type: string
          enum:
            - message
        role:
          type: string
          enum:
            - assistant
        content:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - text
              text:
                type: string
        model:
          type: string
        stop_reason:
          type: string
          enum:
            - end_turn
            - max_tokens
            - stop_sequence
        usage:
          type: object
          properties:
            input_tokens:
              type: integer
            output_tokens:
              type: integer

    ClaudeError:
      type: object
      properties:
        type:
          type: string
          example: error
        error:
          type: object
          properties:
            type:
              type: string
              example: authentication_error
            message:
              type: string

    # Ollama API Schemas
    OllamaGenerateRequest:
      type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
          example: llama3
        prompt:
          type: string
        stream:
          type: boolean
          default: true
        options:
          type: object
          properties:
            temperature:
              type: number
            num_predict:
              type: integer

    OllamaGenerateResponse:
      type: object
      properties:
        model:
          type: string
        created_at:
          type: string
          format: date-time
        response:
          type: string
        done:
          type: boolean
        total_duration:
          type: integer
          description: Total time in nanoseconds
        prompt_eval_count:
          type: integer
        eval_count:
          type: integer

    OllamaChatRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum:
                  - system
                  - user
                  - assistant
              content:
                type: string
        stream:
          type: boolean
          default: true

    OllamaChatResponse:
      type: object
      properties:
        model:
          type: string
        created_at:
          type: string
          format: date-time
        message:
          type: object
          properties:
            role:
              type: string
            content:
              type: string
        done:
          type: boolean

    OllamaModelsResponse:
      type: object
      properties:
        models:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              model:
                type: string
              modified_at:
                type: string
                format: date-time
              size:
                type: integer
              digest:
                type: string

    # Internal Module Schemas
    Decision:
      type: object
      description: Represents a classified action decision
      required:
        - action
        - reason
        - risk_level
      properties:
        action:
          type: string
          enum:
            - auto
            - user
          description: '"auto" for safe operations, "user" for dangerous operations'
        reason:
          type: string
          description: Explanation for the decision
        command:
          type: string
          nullable: true
          description: Extracted command to execute
        risk_level:
          type: string
          enum:
            - low
            - medium
            - high
          description: Risk assessment level
      example:
        action: auto
        reason: Running tests is a safe operation
        command: pytest tests/
        risk_level: low

    ExecutionResult:
      type: object
      description: Result of a command execution
      required:
        - success
        - output
        - error
        - return_code
      properties:
        success:
          type: boolean
          description: Whether execution succeeded
        output:
          type: string
          description: stdout content
        error:
          type: string
          description: stderr content
        return_code:
          type: integer
          description: Process return code
      example:
        success: true
        output: "5 tests passed"
        error: ""
        return_code: 0

    PermissionConfig:
      type: object
      description: Permission configuration from YAML
      properties:
        actions:
          type: object
          additionalProperties:
            type: string
            enum:
              - auto
              - ask
              - deny
          example:
            read_file: auto
            write_file: ask
            deploy: deny
        default:
          type: string
          enum:
            - auto
            - ask
            - deny
          default: ask
        dangerous_keywords:
          type: array
          items:
            type: string
          example:
            - deploy
            - production
            - sudo
        sandbox:
          type: object
          properties:
            root:
              type: string
              default: ./sandbox
            allowed_extensions:
              type: array
              items:
                type: string
              example:
                - .py
                - .txt
                - .json

    ErrorResponse:
      type: object
      properties:
        error_code:
          type: integer
          description: Application error code
        message:
          type: string
          description: Error message
        context:
          type: object
          properties:
            operation:
              type: string
            timestamp:
              type: string
              format: date-time
