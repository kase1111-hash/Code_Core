# Ollama Automation Harness - Docker Compose
# Usage: docker compose run --rm harness

services:
  harness:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ollama-harness
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./sandbox:/app/sandbox
      - ./logs:/app/logs
      - ./config:/app/config:ro
    network_mode: host

  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ollama-harness-dev
    stdin_open: true
    tty: true
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv
      - /app/__pycache__
    network_mode: host
    profiles:
      - dev
